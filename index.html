<script type="module">
(()=>{'use strict';
const ACCT_TYPES=['Efectivo','Ahorro','Cuenta bancaria','Tarjeta','Inversión','Otra'],LEGACY_KEY='balance-web-app-v2',OFFLINE_CACHE_KEY='balance-firestore-cache-v2';
const blank=()=>({version:2,currency:'HNL',holders:[],accounts:[],movements:[],debts:[]});
const firebaseClient=window.firebaseClient||{},firebaseSdk=firebaseClient.sdk||{},db=firebaseClient.db||null;
const collections={holders:'titulares',accounts:'cuentas',movements:'movimientos',debts:'deudas'};
let state={...blank(),currency:preferredCurrency()||'HNL'},cloudCache=blank(),page='resumen',movementQuery={q:'',account:'',type:'',from:'',to:''},auditQuery={holder:'',q:''},firebaseLoading=false,writeQueue=Promise.resolve(),unsubscribe=[],customSelectListenersReady=false;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
function cleanDoc(x){const out={...x};delete out._docId;return out}
function sameDoc(a,b){return JSON.stringify(cleanDoc(a))===JSON.stringify(cleanDoc(b))}
function setSyncStatus(message,kind='info'){const el=$('firebaseStatus');if(el){el.textContent=message;el.className=`px-5 sm:px-8 py-2 text-xs ${kind==='error'?'bg-rose-50 text-rose-700':kind==='ok'?'bg-emerald-50 text-emerald-800':'bg-amber-50 text-amber-800'}`;el.classList.remove('hidden')}const indicator=$('firebaseIndicator');if(indicator){const label=kind==='ok'?'Sincronizado con Firebase':kind==='error'?'Firebase sin conexión':'Conectando con Firebase',dot=kind==='ok'?'bg-emerald-500':kind==='error'?'bg-rose-500':'bg-amber-400';indicator.className=`fixed bottom-4 left-4 z-40 rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-semibold shadow-md ${kind==='ok'?'text-emerald-800':kind==='error'?'text-rose-700':'text-slate-600'}`;indicator.innerHTML=`<span class="inline-flex items-center gap-2"><span class="h-2 w-2 rounded-full ${dot}"></span>${label}</span>`}}
function preferredCurrency(){try{const value=localStorage.getItem('moneda_preferida')||'';return['GTQ','USD','MXN','EUR','CRC','HNL','SVC'].includes(value)?value:''}catch{return''}}
function loadLocalFallback(){try{const saved=JSON.parse(localStorage.getItem(OFFLINE_CACHE_KEY)||localStorage.getItem(LEGACY_KEY)||'null');if(saved&&['holders','accounts','movements','debts'].every(k=>Array.isArray(saved[k])))return{...blank(),...saved,currency:preferredCurrency()||saved.currency||'HNL'};}catch(error){console.warn('No se pudo leer la copia local de respaldo',error)}return{...blank(),currency:preferredCurrency()||'HNL'}}
function writeLocalFallback(){try{localStorage.setItem(OFFLINE_CACHE_KEY,JSON.stringify(state))}catch(error){console.warn('No se pudo actualizar la copia local de respaldo',error)}}
function save(){
  if(!db){
    state=loadLocalFallback();
    render();
    toast(firebaseClient.configured?'Firestore no está disponible. Se muestran los datos locales en modo lectura.':'Completa firebaseConfig para conectar con Firestore. Se muestran los datos locales en modo lectura.',true);
    return Promise.resolve(false);
  }
  if(firebaseLoading){toast('Espera a que termine la sincronización inicial.',true);return Promise.resolve(false)}

  const run=writeQueue.then(async()=>{
    for(const [prop,col] of Object.entries(collections)){
      const previous=new Map(cloudCache[prop].map(item=>[item.id,item]));
      const current=state[prop].slice();
      const currentIds=new Set(current.map(item=>item.id));
      const removed=cloudCache[prop].filter(item=>!currentIds.has(item.id));

      for(let offset=0;offset<removed.length;offset+=200){
        const chunk=removed.slice(offset,offset+200);
        await Promise.all(chunk.map(async item=>{
          await firebaseSdk.deleteDoc(firebaseSdk.doc(db,col,item._docId));
          cloudCache[prop]=cloudCache[prop].filter(cached=>cached.id!==item.id);
        }));
      }

      const additions=[];
      const updates=[];
      for(const item of current){
        const old=previous.get(item.id);
        const data=cleanDoc(item);
        if(!old)additions.push({item,data});
        else if(!sameDoc(old,item))updates.push({item,data,old});
      }

      for(let offset=0;offset<additions.length;offset+=200){
        const chunk=additions.slice(offset,offset+200);
        const created=await Promise.all(chunk.map(async({item,data})=>{
          const reference=await firebaseSdk.addDoc(firebaseSdk.collection(db,col),data);
          return{...item,_docId:reference.id};
        }));
        cloudCache[prop].push(...created);
      }

      for(let offset=0;offset<updates.length;offset+=200){
        const chunk=updates.slice(offset,offset+200);
        await Promise.all(chunk.map(async({item,data,old})=>{
          await firebaseSdk.updateDoc(firebaseSdk.doc(db,col,old._docId),data);
          cloudCache[prop]=cloudCache[prop].map(cached=>cached.id===item.id?{...item,_docId:old._docId}:cached);
        }));
      }
    }
    writeLocalFallback();
    return true;
  });

  writeQueue=run.catch(error=>{
    console.error('Firestore write failed',error);
    state=loadLocalFallback();
    render();
    setSyncStatus('No se pudo guardar. Revisa las reglas de Firestore y tu conexión.','error');
    toast('Error al guardar en Firestore.',true);
    return false;
  });
  return writeQueue;
}
async function startFirebase(){
  if(!firebaseClient.configured||!db){
    state=loadLocalFallback();
    if(consolidateImportedAccounts())writeLocalFallback();
    render();
    setSyncStatus('Firebase no está configurado. Se muestran los datos locales disponibles; la sincronización está desactivada.');
    return;
  }

  firebaseLoading=true;
  setSyncStatus('Conectando con Firebase Cloud Firestore…');
  try{
    const initial=await Promise.all(Object.entries(collections).map(async([prop,col])=>{
      const snapshot=await firebaseSdk.getDocs(firebaseSdk.collection(db,col));
      const rows=snapshot.docs.map(item=>({...item.data(),id:item.data().id||item.id,_docId:item.id}));
      return[prop,rows];
    }));

    for(const[prop,rows]of initial){
      state[prop]=rows;
      cloudCache[prop]=rows.map(item=>({...item}));
    }

    const firestoreEmpty=Object.keys(collections).every(prop=>state[prop].length===0);
    if(firestoreEmpty){
      try{
        const localData=JSON.parse(localStorage.getItem(OFFLINE_CACHE_KEY)||localStorage.getItem(LEGACY_KEY)||'null');
        const hasCollections=localData&&['holders','accounts','movements','debts'].every(key=>Array.isArray(localData[key]));
        if(hasCollections){
          state={...blank(),...localData,currency:preferredCurrency()||localData.currency||'HNL'};
          firebaseLoading=false;
          if(await save())localStorage.removeItem(LEGACY_KEY);
          else setSyncStatus('No se completó la migración anterior; la copia local se conserva.','error');
        }
      }catch(error){console.warn('No se pudo leer el respaldo local anterior',error)}
    }

    firebaseLoading=false;
    const accountsNeedMigration=consolidateImportedAccounts();
    const migrationFailed=accountsNeedMigration?!(await save()):false;
    writeLocalFallback();
    setSyncStatus(migrationFailed?'Firestore conectado, pero no se pudieron consolidar las cuentas importadas.':'Conectado a Firestore · cambios sincronizados en tiempo real.',migrationFailed?'error':'ok');
    render();

    for(const[prop,col]of Object.entries(collections)){
      const stop=firebaseSdk.onSnapshot(firebaseSdk.collection(db,col),snapshot=>{
        const rows=snapshot.docs.map(item=>({...item.data(),id:item.data().id||item.id,_docId:item.id}));
        state[prop]=rows;
        cloudCache[prop]=rows.map(item=>({...item}));
        writeLocalFallback();
        render();
        if(!migrationFailed)setSyncStatus('Conectado a Firestore · cambios sincronizados en tiempo real.','ok');
      },error=>{
        console.error(`Firestore listener ${col}`,error);
        state=loadLocalFallback();
        render();
        setSyncStatus('La sincronización falló. Se muestran los últimos datos locales guardados.','error');
      });
      unsubscribe.push(stop);
    }
  }catch(error){
    firebaseLoading=false;
    console.error('Firestore initialization failed',error);
    state=loadLocalFallback();
    if(consolidateImportedAccounts())writeLocalFallback();
    render();
    setSyncStatus('No se pudo conectar con Firestore. Se muestran los últimos datos locales disponibles.','error');
    toast('Error conectando con Firestore.',true);
  }
}
function icons(){if(window.lucide)lucide.createIcons()}
function enhanceSelects(root=document){
  if(!root?.querySelectorAll)return;

  $('modalHost').innerHTML=`<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" id="annualPreviewBackdrop"><section class="card w-full max-w-lg p-5 sm:p-6 shadow-xl max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true"><div class="flex items-start gap-3"><div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-700"><i data-lucide="file-check-2" class="w-5 h-5"></i></div><div><h2 class="font-bold text-lg">Vista previa de importación</h2><p class="mt-1 text-xs text-slate-500">${esc(fileName)} · ${plan.records.length} movimientos y ${plan.loanControls.length} controles de préstamo</p></div></div>${monthRows?`<div class="mt-5 rounded-xl border border-slate-100 px-4">${monthRows}</div>`:''}${loanRows?`<div class="mt-4 rounded-xl border border-slate-100 px-4"><div class="py-2 text-xs font-bold uppercase tracking-wide text-slate-500">Control de préstamo</div>${loanRows}</div>`:''}<div class="mt-3 rounded-lg bg-slate-50 p-3 text-[11px] text-slate-500"><div><strong>Hojas analizadas:</strong> ${sheetInfo||'—'}</div>${plan.invalid?`<div class="mt-1">${plan.invalid} movimientos omitidos por datos incompletos o inválidos.</div>`:''}${plan.duplicates?`<div class="mt-1">${plan.duplicates} movimientos duplicados omitidos.</div>`:''}<div class="mt-1">Los cuadros de préstamo conservarán cada fecha, concepto, abono y saldo informado.</div></div><div class="mt-5 flex justify-end gap-2"><button class="soft" id="cancelAnnualImport">Cancelar</button><button class="primary inline-flex items-center gap-2" id="confirmAnnualImport"><i data-lucide="download" class="w-4 h-4"></i>Importar ${total} elementos</button></div></section></div>`;
  icons();$('cancelAnnualImport').onclick=()=>$('modalHost').innerHTML='';$('annualPreviewBackdrop').addEventListener('click',event=>{if(event.target.id==='annualPreviewBackdrop')$('modalHost').innerHTML=''});$('confirmAnnualImport').onclick=()=>commitAnnualImport(plan);
}
async function commitAnnualImport(plan){
  const monthCounts={},holderMap=new Map(state.holders.map(item=>[norm(item.name),item]));let addedMovements=0,addedLoans=0,updatedLoans=0;consolidateImportedAccounts();const mainAccount=plan.records.length||plan.loanControls.length?ensureMainAccount():null;
  for(const item of plan.records){
    let person=holderMap.get(norm(item.person));
    if(!person){person={id:uid(),name:item.person,note:'Importado desde registros anuales'};state.holders.push(person);holderMap.set(norm(item.person),person)}
    attachHolder(mainAccount,person.id);
    state.movements.push({id:uid(),type:item.type,accountId:mainAccount.id,amount:item.amount,date:item.date,description:item.description,category:item.category||'',holderId:person.id,legacyRecordId:item.recordId,importSheet:item.sheet,annualImportKey:item.recordId?recordKey(item.sheet,item):'',createdAt:Date.now()+addedMovements});
    monthCounts[item.month]=(monthCounts[item.month]||0)+1;addedMovements++;
  }
  for(const imported of plan.loanControls){
    let debt=state.debts.find(item=>item.loanImportKey===imported.importKey);
    let person=imported.owner?holderMap.get(norm(imported.owner)):null;
    if(imported.owner&&!person){person={id:uid(),name:imported.owner,note:'Importado desde control de préstamo'};state.holders.push(person);holderMap.set(norm(imported.owner),person)}
    let accountItem=debt?account(debt.accountId):null;
    if(!accountItem)accountItem=mainAccount;
    if(person&&accountItem)attachHolder(accountItem,person.id);
    const data={id:debt?.id||uid(),kind:imported.kind,title:imported.title,holderId:person?.id||debt?.holderId||'',contact:imported.owner||debt?.contact||'',accountId:accountItem.id,principal:imported.principal,paid:imported.paid,date:imported.date,dueDate:debt?.dueDate||'',notes:'Importado desde Control de Préstamo',payments:imported.payments,history:imported.history,loanBalance:imported.pending,loanImportKey:imported.importKey,sourceSheet:imported.sourceSheet};
    if(debt){Object.assign(debt,data);updatedLoans++}else{state.debts.push(data);addedLoans++}
  }
  if(!await save())return;
  render();
  const monthText=Object.entries(monthCounts).sort((a,b)=>MONTHS.indexOf(a[0])-MONTHS.indexOf(b[0])).map(([month,count])=>`${month[0].toUpperCase()+month.slice(1)}: ${count}`).join(' · ');
  const summary=[addedMovements?`${addedMovements} movimientos`: '',addedLoans?`${addedLoans} controles nuevos`: '',updatedLoans?`${updatedLoans} controles actualizados`: ''].filter(Boolean).join(' · ')||'Sin cambios';
  $('modalHost').innerHTML=`<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"><section class="card w-full max-w-md p-6 text-center shadow-xl"><div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-700"><i data-lucide="circle-check-big" class="w-6 h-6"></i></div><h2 class="mt-4 text-lg font-bold">Importación completada</h2><p class="mt-2 text-sm text-slate-600">${summary} guardados en Cloud Firestore.</p>${monthText?`<div class="mt-4 rounded-xl bg-slate-50 p-3 text-sm capitalize">${monthText}</div>`:''}<p class="mt-3 text-xs text-slate-500">Los saldos pendientes se calcularon con el último Saldo Deuda y el historial de abonos.</p><button class="primary mt-5" id="closeImportResult">Listo</button></section></div>`;
  icons();$('closeImportResult').onclick=()=>$('modalHost').innerHTML='';
}
async function importFile(file,restore){if(restore){const text=await file.text(),data=JSON.parse(text);if(!data||!Array.isArray(data.accounts)||!Array.isArray(data.movements)||!Array.isArray(data.holders)||!Array.isArray(data.debts))throw Error('Respaldo inválido');const answer=await appDialog({title:'Restaurar respaldo',message:'¿Reemplazar todos los datos actuales con este respaldo?',confirmText:'Restaurar',danger:true});if(!answer.confirmed)return;state={...blank(),...data,currency:preferredCurrency()||data.currency||'HNL'};if(await save()){render();toast('Respaldo restaurado en Firestore')}return}if(!window.XLSX)throw Error('SheetJS no disponible');const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const plan=annualPlan(wb);if(plan.matchedSheets||plan.loanControls.length){previewAnnual(plan,file.name);return}const allRows=wb.SheetNames.flatMap(name=>XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''}));let added=0,skipped=0;for(const r of allRows){let type=String(pick(r,['Tipo','Tipo de movimiento','Movimiento','Type'])||'').trim(),low=norm(type);type=['ingreso','income','deposito','entrada'].includes(low)?'Ingreso':['egreso','gasto','expense','salida'].includes(low)?'Egreso':['transferencia','transfer'].includes(low)?'Transferencia':'';let name=String(pick(r,['Cuenta','Fondo','Account'])||'').trim(),destName=String(pick(r,['Destino','Cuenta destino','A cuenta'])||'').trim(),personName=String(pick(r,['Persona','Titular','Responsable'])||'').trim(),person=personName?state.holders.find(item=>norm(item.name)===norm(personName)):null;if(personName&&!person){person={id:uid(),name:personName,note:'Importado desde Excel'};state.holders.push(person)}let acc=state.accounts.find(a=>norm(a.name)===norm(name));if(!acc&&name){acc={id:uid(),name,type:'Otra',holderId:'',holderIds:[],institution:'',openingBalance:0};state.accounts.push(acc)}if(!acc&&!name&&person)acc=ensureMainAccount();if(person&&acc)attachHolder(acc,person.id);let dest=state.accounts.find(a=>norm(a.name)===norm(destName));if(!dest&&type==='Transferencia'&&destName){dest={id:uid(),name:destName,type:'Otra',holderId:'',institution:'',openingBalance:0};state.accounts.push(dest)}let amount=pick(r,['Monto','Importe','Cantidad','Amount','Valor','Total']);if(typeof amount==='string')amount=Number(amount.replace(/[Q$\s]/g,'').replace(/,(?=\d{3}(?:\D|$))/g,'').replace(',','.'));amount=Number(amount);const date=parseDate(pick(r,['Fecha','Date','Día','Dia'])),description=String(pick(r,['Descripción','Descripcion','Detalle','Concepto','Description'])||'').trim();if(!type||!acc||!date||!description||!(amount>0)||(type==='Transferencia'&&(!dest||dest.id===acc.id))){skipped++;continue}state.movements.push({id:uid(),type,accountId:acc.id,...(type==='Transferencia'?{toAccountId:dest.id}:{}),amount:Math.round(amount*100)/100,date,description,category:String(pick(r,['Categoría','Categoria','Category'])||''),holderId:person?.id||'',createdAt:Date.now()+added});added++}if(added){if(await save()){render();toast(`${added} movimientos guardados en Firestore${skipped?`; ${skipped} filas omitidas`:''}`)}return}toast(`No se importaron movimientos válidos${skipped?`; ${skipped} filas omitidas`:''}`,true)}
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const f=e.target.files?.[0];if(!f)return;const restore=e.target.dataset.restore==='1';delete e.target.dataset.restore;try{if(!db)throw Error('Firebase no está conectado.');await importFile(f,restore)}catch(err){console.error(err);toast('No se pudo completar la importación. Revisa la conexión con Firebase y el archivo.',true)}finally{e.target.value=''}});
$('quickAdd').addEventListener('click',()=>{if(!db){toast('Modo lectura: conecta Firebase para registrar movimientos.',true);return}page='movimientos';render();openMovement()});$('quickImport').addEventListener('click',()=>$('importFile').click());document.addEventListener('click',e=>{if(e.target.closest('[data-action="export-xlsx"]'))exportXlsx()});
// The settings page is the primary export entry point; also add a convenient export control to the header.
const exportButton=document.createElement('button');exportButton.className='soft !px-3 !py-2 hidden md:inline-flex items-center gap-2';exportButton.innerHTML='<i data-lucide="file-spreadsheet" class="w-4 h-4"></i><span>Excel</span>';exportButton.title='Exportar movimientos, cuentas y deudas';$('quickImport').parentElement.insertBefore(exportButton,$('quickImport'));exportButton.addEventListener('click',exportXlsx);
render();icons();startFirebase();document.addEventListener('DOMContentLoaded',()=>{const saved=preferredCurrency();state.currency=saved||'HNL';if(!saved){try{localStorage.setItem('moneda_preferida','HNL')}catch(error){console.warn('No se pudo guardar la moneda predeterminada',error)}}render()},{once:true});
})();
