<script type="module">
(()=>{'use strict';
const ACCT_TYPES=['Efectivo','Ahorro','Cuenta bancaria','Tarjeta','Inversión','Otra'],LEGACY_KEY='balance-web-app-v2',OFFLINE_CACHE_KEY='balance-firestore-cache-v2';
const blank=()=>({version:2,currency:'GTQ',holders:[],accounts:[],movements:[],debts:[]});
const firebaseClient=window.firebaseClient||{},firebaseSdk=firebaseClient.sdk||{},db=firebaseClient.db||null;
const collections={holders:'titulares',accounts:'cuentas',movements:'movimientos',debts:'deudas'};
let state=blank(),cloudCache=blank(),page='resumen',movementQuery={q:'',account:'',type:'',from:'',to:''},firebaseLoading=false,writeQueue=Promise.resolve(),unsubscribe=[];
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
function cleanDoc(x){const out={...x};delete out._docId;return out}
function sameDoc(a,b){return JSON.stringify(cleanDoc(a))===JSON.stringify(cleanDoc(b))}
function setSyncStatus(message,kind='info'){const el=$('firebaseStatus');if(el){el.textContent=message;el.className=`px-5 sm:px-8 py-2 text-xs ${kind==='error'?'bg-rose-50 text-rose-700':kind==='ok'?'bg-emerald-50 text-emerald-800':'bg-amber-50 text-amber-800'}`;el.classList.remove('hidden')}const indicator=$('firebaseIndicator');if(indicator){const label=kind==='ok'?'Sincronizado con Firebase':kind==='error'?'Firebase sin conexión':'Conectando con Firebase',dot=kind==='ok'?'bg-emerald-500':kind==='error'?'bg-rose-500':'bg-amber-400';indicator.className=`fixed bottom-4 left-4 z-40 rounded-full border border-slate-200 bg-white px-3 py-2 text-xs font-semibold shadow-md ${kind==='ok'?'text-emerald-800':kind==='error'?'text-rose-700':'text-slate-600'}`;indicator.innerHTML=`<span class="inline-flex items-center gap-2"><span class="h-2 w-2 rounded-full ${dot}"></span>${label}</span>`}}
function loadLocalFallback(){try{const saved=JSON.parse(localStorage.getItem(OFFLINE_CACHE_KEY)||localStorage.getItem(LEGACY_KEY)||'null');if(saved&&['holders','accounts','movements','debts'].every(k=>Array.isArray(saved[k])))return{...blank(),...saved};}catch(error){console.warn('No se pudo leer la copia local de respaldo',error)}return blank()}
function writeLocalFallback(){try{localStorage.setItem(OFFLINE_CACHE_KEY,JSON.stringify(state))}catch(error){console.warn('No se pudo actualizar la copia local de respaldo',error)}}
function save(){
  if(!db){
    state=loadLocalFallback();
    render();
    toast(firebaseClient.configured?'Firestore no está disponible. Se muestran los datos locales en modo lectura.':'Completa firebaseConfig para conectar con Firestore. Se muestran los datos locales en modo lectura.',true);
    return Promise.resolve(false);
  }
  if(firebaseLoading){toast('Espera a que termine la sincronización inicial.',true);return Promise.resolve(false)}

  const run=writeQueue.then(async()=>{
    for(const [prop,col] of Object.entries(collections)){
      const previous=new Map(cloudCache[prop].map(item=>[item.id,item]));
      const current=state[prop].slice();
      const currentIds=new Set(current.map(item=>item.id));
      const removed=cloudCache[prop].filter(item=>!currentIds.has(item.id));

      for(let offset=0;offset<removed.length;offset+=200){
        const chunk=removed.slice(offset,offset+200);
        await Promise.all(chunk.map(async item=>{
          await firebaseSdk.deleteDoc(firebaseSdk.doc(db,col,item._docId));
          cloudCache[prop]=cloudCache[prop].filter(cached=>cached.id!==item.id);
        }));
      }

      const additions=[];
      const updates=[];
      for(const item of current){
        const old=previous.get(item.id);
        const data=cleanDoc(item);
        if(!old)additions.push({item,data});
        else if(!sameDoc(old,item))updates.push({item,data,old});
      }

      for(let offset=0;offset<additions.length;offset+=200){
        const chunk=additions.slice(offset,offset+200);
        const created=await Promise.all(chunk.map(async({item,data})=>{
          const reference=await firebaseSdk.addDoc(firebaseSdk.collection(db,col),data);
          return{...item,_docId:reference.id};
        }));
        cloudCache[prop].push(...created);
      }

      for(let offset=0;offset<updates.length;offset+=200){
        const chunk=updates.slice(offset,offset+200);
        await Promise.all(chunk.map(async({item,data,old})=>{
          await firebaseSdk.updateDoc(firebaseSdk.doc(db,col,old._docId),data);
          cloudCache[prop]=cloudCache[prop].map(cached=>cached.id===item.id?{...item,_docId:old._docId}:cached);
        }));
      }
    }
    writeLocalFallback();
    return true;
  });

  writeQueue=run.catch(error=>{
    console.error('Firestore write failed',error);
    state=loadLocalFallback();
    render();
    setSyncStatus('No se pudo guardar. Revisa las reglas de Firestore y tu conexión.','error');
    toast('Error al guardar en Firestore.',true);
    return false;
  });
  return writeQueue;
}
async function startFirebase(){
  if(!firebaseClient.configured||!db){
    state=loadLocalFallback();
    render();
    setSyncStatus('Firebase no está configurado. Se muestran los datos locales disponibles; la sincronización está desactivada.');
    return;
  }

  firebaseLoading=true;
  setSyncStatus('Conectando con Firebase Cloud Firestore…');
  try{
    const initial=await Promise.all(Object.entries(collections).map(async([prop,col])=>{
      const snapshot=await firebaseSdk.getDocs(firebaseSdk.collection(db,col));
      const rows=snapshot.docs.map(item=>({...item.data(),id:item.data().id||item.id,_docId:item.id}));
      return[prop,rows];
    }));

    for(const[prop,rows]of initial){
      state[prop]=rows;
      cloudCache[prop]=rows.map(item=>({...item}));
    }

    const firestoreEmpty=Object.keys(collections).every(prop=>state[prop].length===0);
    if(firestoreEmpty){
      try{
        const localData=JSON.parse(localStorage.getItem(OFFLINE_CACHE_KEY)||localStorage.getItem(LEGACY_KEY)||'null');
        const hasCollections=localData&&['holders','accounts','movements','debts'].every(key=>Array.isArray(localData[key]));
        if(hasCollections){
          state={...blank(),...localData};
          firebaseLoading=false;
          if(await save())localStorage.removeItem(LEGACY_KEY);
          else setSyncStatus('No se completó la migración anterior; la copia local se conserva.','error');
        }
      }catch(error){console.warn('No se pudo leer el respaldo local anterior',error)}
    }

    firebaseLoading=false;
    writeLocalFallback();
    setSyncStatus('Conectado a Firestore · cambios sincronizados en tiempo real.','ok');
    render();

    for(const[prop,col]of Object.entries(collections)){
      const stop=firebaseSdk.onSnapshot(firebaseSdk.collection(db,col),snapshot=>{
        const rows=snapshot.docs.map(item=>({...item.data(),id:item.data().id||item.id,_docId:item.id}));
        state[prop]=rows;
        cloudCache[prop]=rows.map(item=>({...item}));
        writeLocalFallback();
        render();
        setSyncStatus('Conectado a Firestore · cambios sincronizados en tiempo real.','ok');
      },error=>{
        console.error(`Firestore listener ${col}`,error);
        state=loadLocalFallback();
        render();
        setSyncStatus('La sincronización falló. Se muestran los últimos datos locales guardados.','error');
      });
      unsubscribe.push(stop);
    }
  }catch(error){
    firebaseLoading=false;
    console.error('Firestore initialization failed',error);
    state=loadLocalFallback();
    render();
    setSyncStatus('No se pudo conectar con Firestore. Se muestran los últimos datos locales disponibles.','error');
    toast('Error conectando con Firestore.',true);
  }
}
function icons(){if(window.lucide)lucide.createIcons()}
function toast(msg,error=false){const n=document.createElement('div');n.className='toast card px-4 py-3 flex items-center gap-2 text-sm shadow-lg';n.innerHTML=`<i data-lucide="${error?'circle-alert':'circle-check'}" class="w-4 h-4 ${error?'text-rose-600':'text-emerald-600'}"></i><span>${esc(msg)}</span>`;$('toastHost').append(n);icons();setTimeout(()=>n.remove(),3500)}
const currency=()=>state.currency||'GTQ';function money(n){try{return new Intl.NumberFormat('es-GT',{style:'currency',currency:currency()}).format(Number(n)||0)}catch{return`${currency()} ${(Number(n)||0).toFixed(2)}`}}
function dateText(s){if(!s)return'—';const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Intl.DateTimeFormat('es-GT',{day:'numeric',month:'short',year:'numeric'}).format(new Date(y,m-1,d))}
function account(id){return state.accounts.find(a=>a.id===id)}function holder(id){return state.holders.find(h=>h.id===id)}function balance(id){return state.movements.reduce((v,m)=>v+(m.type==='Ingreso'&&m.accountId===id?Number(m.amount):m.type==='Egreso'&&m.accountId===id?-Number(m.amount):m.type==='Transferencia'&&m.toAccountId===id?Number(m.amount):m.type==='Transferencia'&&m.accountId===id?-Number(m.amount):0),0)}
function allBalance(){return state.accounts.reduce((n,a)=>n+balance(a.id),0)}function sum(list,fn){return list.reduce((n,x)=>n+fn(x),0)}
function badge(text,color='green'){let c=color==='red'?'bg-rose-50 text-rose-700':color==='blue'?'bg-blue-50 text-blue-700':color==='amber'?'bg-amber-50 text-amber-700':'bg-emerald-50 text-emerald-700';return`<span class="inline-flex rounded-full px-2.5 py-1 text-[11px] font-semibold ${c}">${esc(text)}</span>`}
function empty(title,desc,action=''){return`<div class="py-14 text-center"><div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-50 text-slate-400"><i data-lucide="inbox" class="w-5 h-5"></i></div><div class="font-semibold text-sm">${esc(title)}</div><p class="mt-1 text-xs text-slate-500">${esc(desc)}</p>${action?`<div class="mt-4">${action}</div>`:''}</div>`}
function stat(title,val,icon,sub='',accent=''){return`<div class="card p-4 sm:p-5"><div class="flex items-center justify-between"><span class="text-xs sm:text-sm font-medium text-slate-500">${title}</span><span class="flex h-8 w-8 items-center justify-center rounded-xl bg-slate-50 text-slate-500"><i data-lucide="${icon}" class="w-4 h-4"></i></span></div><div class="metric mt-3 text-xl font-bold tracking-tight ${accent}">${val}</div>${sub?`<div class="mt-1 text-[11px] text-slate-400">${sub}</div>`:''}</div>`}

function pageHeader(title,desc,button=''){return`<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><div><p class="text-sm text-slate-500">${desc}</p><h2 class="mt-1 text-2xl font-bold tracking-tight">${title}</h2></div>${button}</div>`}
function addBtn(text,action){return`<button class="primary inline-flex items-center gap-2" data-action="${action}"><i data-lucide="plus" class="w-4 h-4"></i>${text}</button>`}
function renderSummary(){const positives=sum(state.accounts,a=>Math.max(0,balance(a.id))),negative=sum(state.accounts,a=>Math.min(0,balance(a.id))),debtDue=sum(state.debts,d=>Math.max(0,Number(d.principal)-Number(d.paid||0))),incomes=sum(state.movements.filter(m=>m.type==='Ingreso'),m=>Number(m.amount)),outgo=sum(state.movements.filter(m=>m.type==='Egreso'),m=>Number(m.amount));let content=`${pageHeader('Resumen','Distribución de tus cuentas y patrimonio total')}<div class="grid grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4 mb-6">${stat('Patrimonio en cuentas',money(allBalance()),'landmark',`${state.accounts.length} ${state.accounts.length===1?'cuenta':'cuentas'}`,'text-[#176d51]')}${stat('Ingresos registrados',money(incomes),'trending-up',`${state.movements.filter(m=>m.type==='Ingreso').length} movimientos`,'text-emerald-700')}${stat('Egresos registrados',money(outgo),'trending-down',`${state.movements.filter(m=>m.type==='Egreso').length} movimientos`,'text-rose-600')}${stat('Saldo pendiente de deudas',money(debtDue),'hand-coins',`${state.debts.length} ${state.debts.length===1?'registro':'registros'}`,'text-amber-700')}</div>`;
 content+=`<div class="grid xl:grid-cols-[1.2fr_.8fr] gap-4 mb-4"><section class="card overflow-hidden"><div class="px-5 py-4 flex justify-between items-center"><div><h3 class="font-bold text-sm">Cuentas y titulares</h3><p class="text-xs text-slate-400 mt-1">Saldo disponible por cuenta</p></div><button class="text-xs font-semibold text-emerald-700" data-goto="cuentas">Ver cuentas →</button></div>`;
 if(!state.accounts.length)content+=empty('¡Alerta de bolsillo vacío! 😱','¡Abre una cuenta y que empiece la aventura del dinero!',`<button class="soft" data-action="new-account">Crear cuenta</button>`);else{const rows=state.accounts.map(a=>`<tr class="border-t border-slate-50"><td class="px-5 py-3"><div class="text-sm font-semibold">${esc(a.name)}</div><div class="text-[11px] text-slate-400 mt-0.5">${esc(a.type)}${a.institution?' · '+esc(a.institution):''}</div></td><td class="px-4 py-3 text-sm text-slate-500">${esc(holder(a.holderId)?.name||'Sin titular')}</td><td class="px-5 py-3 text-right text-sm font-bold metric ${balance(a.id)<0?'text-rose-600':'text-slate-800'}">${money(balance(a.id))}</td></tr>`).join('');content+=tableShell(['Cuenta','Titular','Saldo'],rows)}content+=`</section><section class="card overflow-hidden"><div class="px-5 py-4"><h3 class="font-bold text-sm">Actividad reciente</h3><p class="text-xs text-slate-400 mt-1">Últimos movimientos de tus cuentas</p></div>`;
 const recent=[...state.movements].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0)).slice(0,5);if(!recent.length)content+=empty('¡Todavía no hay acción en el barrio!','Cuando el dinero salga a escena, lo verás aquí. 🎬');else content+=recent.map(m=>`<div class="flex items-center gap-3 border-t border-slate-50 px-5 py-3"><div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl ${m.type==='Ingreso'?'bg-emerald-50 text-emerald-700':m.type==='Egreso'?'bg-rose-50 text-rose-600':'bg-blue-50 text-blue-700'}"><i data-lucide="${m.type==='Ingreso'?'arrow-down-left':m.type==='Egreso'?'arrow-up-right':'arrow-left-right'}" class="w-4 h-4"></i></div><div class="min-w-0 flex-1"><div class="truncate text-xs font-semibold">${esc(m.description)}</div><div class="mt-0.5 text-[10px] text-slate-400">${dateText(m.date)} · ${esc(account(m.accountId)?.name||'Cuenta eliminada')}</div></div><div class="text-right text-xs font-bold metric ${m.type==='Ingreso'?'text-emerald-700':m.type==='Egreso'?'text-slate-700':'text-blue-700'}">${m.type==='Egreso'?'−':m.type==='Ingreso'?'+':''}${money(m.amount)}</div></div>`).join('');content+=`</section></div><section class="card p-5"><div class="flex items-center justify-between"><div><h3 class="font-bold text-sm">Patrimonio por titular</h3><p class="text-xs text-slate-400 mt-1">Saldos agrupados por responsable de cada cuenta</p></div><button class="text-xs font-semibold text-emerald-700" data-goto="titulares">Gestionar titulares →</button></div>`;
 if(!state.holders.length)content+=`<p class="mt-5 text-xs text-slate-500">¡Este elenco necesita titulares! Crea personajes en la sección Titulares. 🎭</p>`;else{const holderRows=state.holders.map(h=>{const accts=state.accounts.filter(a=>a.holderId===h.id);return`<div class="flex items-center justify-between border-t border-slate-100 py-3 first:mt-4"><div class="flex items-center gap-3"><div class="flex h-9 w-9 items-center justify-center rounded-full bg-[#eaf4ee] text-xs font-bold text-[#176d51]">${esc(h.name.trim().slice(0,1).toUpperCase())}</div><div><div class="text-sm font-semibold">${esc(h.name)}</div><div class="text-[11px] text-slate-400">${accts.length} ${accts.length===1?'cuenta':'cuentas'}</div></div></div><div class="font-bold text-sm metric">${money(sum(accts,a=>balance(a.id)))}</div></div>`}).join('');content+=holderRows}content+='</section>';return content}
function movementRows(){const q=movementQuery.q.toLocaleLowerCase('es'),arr=[...state.movements].filter(m=>(!movementQuery.account||m.accountId===movementQuery.account||m.toAccountId===movementQuery.account)&&(!movementQuery.type||m.type===movementQuery.type)&&(!movementQuery.from||m.date>=movementQuery.from)&&(!movementQuery.to||m.date<=movementQuery.to)&&(!q||`${m.description} ${m.category||''} ${account(m.accountId)?.name||''} ${account(m.toAccountId)?.name||''}`.toLocaleLowerCase('es').includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));return arr.map(m=>{const transfer=m.type==='Transferencia',dest=account(m.toAccountId);return`<tr class="border-b border-slate-50 hover:bg-[#fbfcfb]"><td class="px-5 py-3.5 text-xs text-slate-500 whitespace-nowrap">${dateText(m.date)}</td><td class="px-4 py-3.5"><div class="max-w-[220px] truncate text-xs font-semibold" title="${esc(m.description)}">${esc(m.description)}</div>${m.category?`<div class="mt-1 text-[10px] text-slate-400">${esc(m.category)}</div>`:''}</td><td class="px-4 py-3.5 text-xs text-slate-600">${esc(account(m.accountId)?.name||'Cuenta eliminada')}${transfer?`<span class="text-slate-400"> → ${esc(dest?.name||'Cuenta eliminada')}</span>`:''}</td><td class="px-4 py-3.5">${badge(m.type,m.type==='Ingreso'?'green':m.type==='Egreso'?'red':'blue')}</td><td class="px-4 py-3.5 text-right text-xs font-bold metric ${m.type==='Ingreso'?'text-emerald-700':m.type==='Transferencia'?'text-blue-700':'text-slate-800'}">${m.type==='Ingreso'?'+':m.type==='Egreso'?'−':''}${money(m.amount)}</td><td class="px-5 py-3 text-right"><button class="p-2 text-slate-400 hover:text-rose-600" title="Eliminar" data-delete-movement="${esc(m.id)}"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`}).join('')}
function renderMovements(){let accountOptions=state.accounts.map(a=>`<option value="${esc(a.id)}" ${movementQuery.account===a.id?'selected':''}>${esc(a.name)}</option>`).join('');return`${pageHeader('Movimientos','Registra y consulta ingresos, egresos y transferencias.',addBtn('Registrar movimiento','new-movement'))}<div class="card mb-4 p-4"><div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-3"><div class="relative"><i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i><input class="field pl-9 text-sm" placeholder="Buscar detalle o cuenta" id="movementSearch" value="${esc(movementQuery.q)}"></div><select class="field text-sm" id="movementAccount"><option value="">Todas las cuentas</option>${accountOptions}</select><select class="field text-sm" id="movementType"><option value="">Todos los tipos</option>${['Ingreso','Egreso','Transferencia'].map(x=>`<option ${movementQuery.type===x?'selected':''}>${x}</option>`).join('')}</select><input class="field text-sm" type="date" id="movementFrom" aria-label="Desde" value="${esc(movementQuery.from)}"><input class="field text-sm" type="date" id="movementTo" aria-label="Hasta" value="${esc(movementQuery.to)}"></div></div><section class="card overflow-hidden">${state.accounts.length?tableShell(['Fecha','Descripción','Cuenta / destino','Tipo','Monto',''],movementRows()):empty('Primero crea una cuenta','Los movimientos se asocian a una cuenta. Crea una para empezar.',`<button class="soft" data-action="new-account">Crear cuenta</button>`)}${state.accounts.length&&state.movements.length===0?empty('¡Aún no hay aventuras de dinero! 🦸','Registra tu primer ingreso, egreso o transferencia.') : ''}</section>`}
function renderAccounts(){const rows=state.accounts.map(a=>`<tr class="border-b border-slate-50"><td class="px-5 py-4"><div class="font-semibold text-sm">${esc(a.name)}</div><div class="text-[11px] text-slate-400 mt-1">${esc(a.type)}${a.institution?' · '+esc(a.institution):''}</div></td><td class="px-4 py-4 text-sm text-slate-600">${esc(holder(a.holderId)?.name||'—')}</td><td class="px-4 py-4 text-xs text-slate-500">${a.openingBalance?money(a.openingBalance):'—'}</td><td class="px-4 py-4 text-right font-bold text-sm metric ${balance(a.id)<0?'text-rose-600':''}">${money(balance(a.id))}</td><td class="px-4 py-3 text-right whitespace-nowrap"><button class="p-2 text-slate-400 hover:text-emerald-700" title="Editar" data-edit-account="${esc(a.id)}"><i data-lucide="pencil" class="w-4 h-4"></i></button><button class="p-2 text-slate-400 hover:text-rose-600" title="Eliminar" data-delete-account="${esc(a.id)}"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('');return`${pageHeader('Cuentas','Administra efectivo, bancos, ahorro, tarjetas y otras cuentas.',addBtn('Nueva cuenta','new-account'))}<div class="mb-4 grid grid-cols-2 gap-3">${stat('Cuentas activas',state.accounts.length,'wallet-cards')}${stat('Patrimonio neto en cuentas',money(allBalance()),'landmark','','text-[#176d51]')}</div><section class="card overflow-hidden">${state.accounts.length?tableShell(['Cuenta','Titular','Saldo inicial','Saldo actual',''],rows):empty('¡Alerta de bolsillo vacío! 😱','Crea cuentas para organizar tu dinero y registrar movimientos.',`<button class="primary" data-action="new-account">Crear mi primera cuenta</button>`)}</section><p class="mt-3 text-[11px] text-slate-400">El saldo actual parte del saldo inicial más tus ingresos, egresos y transferencias.</p>`}
function renderHolders(){const rows=state.holders.map(h=>{const accts=state.accounts.filter(a=>a.holderId===h.id);return`<article class="card p-5"><div class="flex items-start justify-between"><div class="flex items-center gap-3"><div class="flex h-11 w-11 items-center justify-center rounded-full bg-[#eaf4ee] font-bold text-[#176d51]">${esc(h.name.trim().slice(0,1).toUpperCase())}</div><div><h3 class="font-bold text-sm">${esc(h.name)}</h3><p class="mt-1 text-xs text-slate-400">${accts.length} ${accts.length===1?'cuenta asignada':'cuentas asignadas'}</p></div></div><div class="flex"><button class="p-2 text-slate-400 hover:text-emerald-700" data-edit-holder="${esc(h.id)}" title="Editar"><i data-lucide="pencil" class="w-4 h-4"></i></button><button class="p-2 text-slate-400 hover:text-rose-600" data-delete-holder="${esc(h.id)}" title="Eliminar"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div><div class="mt-5 border-t border-slate-100 pt-4 flex items-center justify-between"><span class="text-xs text-slate-500">Patrimonio asignado</span><strong class="metric text-sm">${money(sum(accts,a=>balance(a.id)))}</strong></div>${accts.length?`<div class="mt-3 flex flex-wrap gap-1.5">${accts.map(a=>badge(a.name)).join('')}</div>`:''}</article>`}).join('');return`${pageHeader('Titulares','Crea las personas responsables de tus cuentas y fondos.',addBtn('Nuevo titular','new-holder'))}${state.holders.length?`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${rows}</div>`:`<section class="card">${empty('¡Falta el elenco principal! 🎭','Añade al equipo que cuidará cada peso.',`<button class="primary" data-action="new-holder">Crear titular</button>`)}</section>`}`}
function getDebtHistory(debt){if(Array.isArray(debt.history)&&debt.history.length)return debt.history;const payments=Array.isArray(debt.payments)?debt.payments:[];let balance=Number(debt.principal)||0;return[{date:debt.date,concept:'Préstamo inicial',payment:0,balance,type:'Inicial'},...payments.map(payment=>{balance=payment.balance!=null?Number(payment.balance):Math.max(0,balance-Number(payment.amount||0));return{...payment,payment:payment.amount,type:'Abono',balance}})]}
function renderDebts(){
  const rows=state.debts.map(debt=>{
    const principal=Number(debt.principal)||0,paid=Number(debt.paid)||0,left=Math.max(0,debt.loanBalance!=null?Number(debt.loanBalance):principal-paid),pct=principal?Math.min(100,paid/principal*100):0,history=getDebtHistory(debt);
    const historyRows=history.map(entry=>`<tr class="border-t border-slate-100"><td class="py-2 pr-3 whitespace-nowrap">${dateText(entry.date)}</td><td class="py-2 pr-3">${esc(entry.concept||entry.type||'Abono')}</td><td class="py-2 pr-3 text-right tabular">${Number(entry.payment||entry.amount||0)?money(entry.payment||entry.amount):'—'}</td><td class="py-2 text-right tabular font-semibold">${entry.balance!=null?money(entry.balance):'—'}</td></tr>`).join('');
    const historyPanel=history.length?`<details class="mt-2 text-[10px]"><summary class="cursor-pointer font-semibold text-emerald-700">Ver historial (${Math.max(0,history.length-1)} abonos)</summary><div class="mt-2 max-w-[520px] overflow-x-auto rounded-lg bg-slate-50 px-3"><table class="w-full min-w-[390px] text-left"><thead><tr class="text-[9px] uppercase tracking-wide text-slate-400"><th class="py-2 pr-3">Fecha</th><th class="py-2 pr-3">Concepto</th><th class="py-2 pr-3 text-right">Abono</th><th class="py-2 text-right">Saldo deuda</th></tr></thead><tbody>${historyRows}</tbody></table></div></details>`:'';
    return`<tr class="border-b border-slate-50"><td class="px-5 py-4"><div class="text-sm font-semibold">${esc(debt.title)}</div><div class="text-[11px] text-slate-400 mt-1">${esc(holder(debt.holderId)?.name||debt.contact||'Sin titular')}${debt.dueDate?' · Vence '+dateText(debt.dueDate):''}</div><div class="mt-2 h-1.5 w-32 rounded-full bg-slate-100"><div class="h-1.5 rounded-full bg-emerald-500" style="width:${pct}%"></div></div>${historyPanel}</td><td class="px-4 py-4">${badge(debt.kind,debt.kind==='Por cobrar'?'green':'amber')}</td><td class="px-4 py-4 text-xs text-slate-600">${esc(account(debt.accountId)?.name||'Cuenta eliminada')}</td><td class="px-4 py-4 text-right text-xs metric">${money(principal)}</td><td class="px-4 py-4 text-right text-xs metric text-emerald-700">${money(paid)}</td><td class="px-4 py-4 text-right text-sm font-bold metric ${left?'text-amber-700':'text-emerald-700'}">${money(left)}</td><td class="px-5 py-3 text-right whitespace-nowrap">${left?`<button class="soft !px-2.5 !py-1.5 text-xs" data-pay-debt="${esc(debt.id)}">Abonar</button>`:badge('Pagado')}<button class="p-2 text-slate-400 hover:text-rose-600" data-delete-debt="${esc(debt.id)}" title="Eliminar"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`;
  }).join('');
  const dueByKind=kind=>sum(state.debts.filter(debt=>debt.kind===kind),debt=>Math.max(0,debt.loanBalance!=null?Number(debt.loanBalance):Number(debt.principal)-Number(debt.paid||0)));
  return`${pageHeader('Deudas y préstamos','Registra préstamos y revisa el historial de abonos importado o registrado.',addBtn('Nueva deuda o préstamo','new-debt'))}<div class="mb-4 grid grid-cols-2 gap-3">${stat('Pendiente por cobrar',money(dueByKind('Por cobrar')),'hand-coins')}${stat('Pendiente por pagar',money(dueByKind('Por pagar')),'credit-card')}</div><section class="card overflow-hidden">${state.debts.length?tableShell(['Préstamo / contacto','Tipo','Cuenta vinculada','Monto inicial','Abonado','Pendiente',''],rows):empty('¡Ni una deuda villana por aquí! 🦹','Este módulo está más tranquilo que un gato con presupuesto. Registra o importa un préstamo.',`<button class="primary" data-action="new-debt">Registrar deuda o préstamo</button>`)}</section><p class="mt-3 text-[11px] text-slate-400">Los controles importados conservan cada abono y el saldo informado en Excel. Los abonos manuales también actualizan el movimiento de la cuenta.</p>`
}
function renderSettings(){return`${pageHeader('Configuración','Ajusta la moneda, guarda un respaldo o administra tus datos.')}<div class="grid xl:grid-cols-2 gap-4"><section class="card p-5 sm:p-6"><div class="flex items-center gap-3 mb-5"><div class="flex h-9 w-9 items-center justify-center rounded-xl bg-slate-50 text-slate-600"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i></div><div><h3 class="font-bold text-sm">Preferencias generales</h3><p class="text-xs text-slate-400">Personaliza la presentación de tus saldos</p></div></div><label class="label" for="currencySelect">Moneda</label><select id="currencySelect" class="field max-w-sm"><option value="GTQ" ${currency()==='GTQ'?'selected':''}>Quetzal guatemalteco (GTQ)</option><option value="USD" ${currency()==='USD'?'selected':''}>Dólar estadounidense (USD)</option><option value="MXN" ${currency()==='MXN'?'selected':''}>Peso mexicano (MXN)</option><option value="EUR" ${currency()==='EUR'?'selected':''}>Euro (EUR)</option><option value="CRC" ${currency()==='CRC'?'selected':''}>Colón costarricense (CRC)</option><option value="HNL" ${currency()==='HNL'?'selected':''}>Lempira hondureño (HNL)</option><option value="SVC" ${currency()==='SVC'?'selected':''}>Dólar salvadoreño (USD)</option></select><p class="text-[11px] text-slate-400 mt-2">La moneda solo cambia la forma de mostrar los importes durante esta sesión.</p></section><section class="card p-5 sm:p-6"><div class="flex items-center gap-3 mb-5"><div class="flex h-9 w-9 items-center justify-center rounded-xl bg-emerald-50 text-emerald-700"><i data-lucide="database-backup" class="w-4 h-4"></i></div><div><h3 class="font-bold text-sm">Respaldo y restauración</h3><p class="text-xs text-slate-400">Descarga una copia JSON o restaura sus datos en Firestore</p></div></div><div class="flex flex-wrap gap-2"><button class="soft inline-flex items-center gap-2" data-action="backup"><i data-lucide="download" class="w-4 h-4"></i>Descargar respaldo</button><button class="soft inline-flex items-center gap-2" data-action="restore"><i data-lucide="upload" class="w-4 h-4"></i>Restaurar respaldo</button></div><p class="text-[11px] text-slate-400 mt-3">Incluye titulares, cuentas, movimientos, préstamos y configuración.</p></section><section class="card p-5 sm:p-6 xl:col-span-2 border-rose-100"><div class="flex items-start gap-3"><div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-rose-50 text-rose-600"><i data-lucide="triangle-alert" class="w-4 h-4"></i></div><div class="flex-1"><h3 class="font-bold text-sm">Zona de limpieza</h3><p class="text-xs text-slate-500 mt-1">Elimina titulares, cuentas, movimientos y deudas guardados en Firestore.</p><button class="mt-4 rounded-lg border border-rose-200 px-3 py-2 text-xs font-semibold text-rose-700 hover:bg-rose-50" data-action="clear-all">Eliminar todos los datos</button></div></div></section></div><p class="mt-5 text-xs text-slate-400 flex items-center gap-1.5"><i data-lucide="cloud" class="w-4 h-4"></i>La información financiera se guarda en Cloud Firestore y se sincroniza entre dispositivos.</p>`}
function render(){const names={resumen:'Resumen',movimientos:'Movimientos',cuentas:'Cuentas',titulares:'Titulares',deudas:'Deudas y préstamos',configuracion:'Configuración'};$('pageTitle').textContent=names[page];$('crumb').textContent=`Espacio financiero / ${names[page]}`;document.querySelectorAll('.nav-link[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===page));$('view').innerHTML=page==='resumen'?renderSummary():page==='movimientos'?renderMovements():page==='cuentas'?renderAccounts():page==='titulares'?renderHolders():page==='deudas'?renderDebts():renderSettings();icons()}
function showModal(title,body,submitText='Guardar'){ $('modalHost').innerHTML=`<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/35 p-4" data-backdrop><section class="card w-full max-w-lg p-5 sm:p-6 shadow-xl max-h-[92vh] overflow-y-auto" role="dialog" aria-modal="true"><div class="flex items-start justify-between mb-5"><div><h2 class="font-bold text-lg">${title}</h2><p class="mt-1 text-xs text-slate-500">Los cambios se guardan en Cloud Firestore.</p></div><button class="p-1 text-slate-400 hover:text-slate-700" data-close><i data-lucide="x" class="w-5 h-5"></i></button></div><form id="modalForm">${body}<div class="mt-6 flex justify-end gap-2"><button type="button" class="soft" data-close>Cancelar</button><button class="primary" type="submit">${submitText}</button></div></form></section></div>`;$('modalHost').querySelectorAll('[data-close],[data-backdrop]').forEach(x=>x.addEventListener('click',e=>{if(e.target===x||x.hasAttribute('data-close'))$('modalHost').innerHTML=''}));icons() }

function parseImportAmount(value){if(typeof value==='number')return Number.isFinite(value)?value:NaN;let text=String(value??'').trim().replace(/[Qq$\s]/g,'');if(!text)return NaN;text=text.replace(/[^\d,().-]/g,'').replace(/[()]/g,'');const comma=text.lastIndexOf(','),dot=text.lastIndexOf('.');if(comma>=0&&dot>=0){const decimal=comma>dot?',':'.';text=decimal===','?text.replace(/\./g,'').replace(',','.'):text.replace(/,/g,'')}else if(comma>=0){const decimals=text.length-comma-1;text=decimals>0&&decimals<=2?text.replace(',','.'):text.replace(/,/g,'')}else if(dot>=0&&text.length-dot-1>2){text=text.replace(/\./g,'')}return Number(text)}

function recordKey(sheet,r){return`${norm(sheet)}::${String(r.recordId).trim()}`}
function annualPlan(wb){
  const records=[],months={},sheets={},loanControls=[],seen=new Set();let invalid=0,duplicates=0,matchedSheets=0;
  for(const sheetName of wb.SheetNames){
    const importedLoans=extractLoanControls(wb.Sheets[sheetName],sheetName);
    loanControls.push(...importedLoans);
    const rows=annualSheetRows(wb.Sheets[sheetName]);
    if(!rows)continue;
    matchedSheets++;
    for(const row of rows){
      const date=parseDate(row.date),person=row.person,type=['entrada','ingreso','ingresos'].includes(norm(row.type))?'Ingreso':['salida','egreso','egresos'].includes(norm(row.type))?'Egreso':'';

      if(!date||!person||!type||!Number.isFinite(amount)||amount<=0){invalid++;continue}
      const key=recordKey(sheetName,row);
      if((row.recordId!==''&&state.movements.some(m=>m.annualImportKey===key))||seen.has(key)){duplicates++;continue}
      if(row.recordId!=='')seen.add(key);
      const item={sheet:sheetName,recordId:String(row.recordId??'').trim(),date,month:MONTHS[Number(date.slice(5,7))-1],person,type,amount:Math.round(amount*100)/100,category:row.category,description:row.description||row.category||'Movimiento importado'};
      records.push(item);months[item.month]=(months[item.month]||0)+1;sheets[sheetName]=(sheets[sheetName]||0)+1;
    }
  }
  return{records,months,sheets,loanControls,invalid,duplicates,matchedSheets};
}
function previewAnnual(plan,fileName){
  if(!plan.records.length&&!plan.loanControls.length){toast(plan.duplicates?'Este archivo ya fue importado; no hay registros nuevos.':'No se encontraron movimientos ni controles de préstamo reconocibles.',true);return}
  const monthRows=Object.entries(plan.months).sort((a,b)=>MONTHS.indexOf(a[0])-MONTHS.indexOf(b[0])).map(([month,count])=>`<div class="flex justify-between border-t border-slate-100 py-2 text-sm"><span class="capitalize">${month}</span><strong>${count} ${count===1?'movimiento':'movimientos'}</strong></div>`).join('');
  const loanRows=plan.loanControls.map(debt=>`<div class="flex justify-between border-t border-slate-100 py-2 text-sm"><span>${esc(debt.title)} · ${debt.payments.length} abonos</span><strong>${money(debt.pending)} pendiente</strong></div>`).join('');
  const sheetInfo=[...new Set([...Object.keys(plan.sheets),...plan.loanControls.map(debt=>debt.sourceSheet)])].map(esc).join(' · '),total=plan.records.length+plan.loanControls.length;
  $('modalHost').innerHTML=`<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4" id="annualPreviewBackdrop"><section class="card w-full max-w-lg p-5 sm:p-6 shadow-xl max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true"><div class="flex items-start gap-3"><div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-700"><i data-lucide="file-check-2" class="w-5 h-5"></i></div><div><h2 class="font-bold text-lg">Vista previa de importación</h2><p class="mt-1 text-xs text-slate-500">${esc(fileName)} · ${plan.records.length} movimientos y ${plan.loanControls.length} controles de préstamo</p></div></div>${monthRows?`<div class="mt-5 rounded-xl border border-slate-100 px-4">${monthRows}</div>`:''}${loanRows?`<div class="mt-4 rounded-xl border border-slate-100 px-4"><div class="py-2 text-xs font-bold uppercase tracking-wide text-slate-500">Control de préstamo</div>${loanRows}</div>`:''}<div class="mt-3 rounded-lg bg-slate-50 p-3 text-[11px] text-slate-500"><div><strong>Hojas analizadas:</strong> ${sheetInfo||'—'}</div>${plan.invalid?`<div class="mt-1">${plan.invalid} movimientos omitidos por datos incompletos o inválidos.</div>`:''}${plan.duplicates?`<div class="mt-1">${plan.duplicates} movimientos duplicados omitidos.</div>`:''}<div class="mt-1">Los cuadros de préstamo conservarán cada fecha, concepto, abono y saldo informado.</div></div><div class="mt-5 flex justify-end gap-2"><button class="soft" id="cancelAnnualImport">Cancelar</button><button class="primary inline-flex items-center gap-2" id="confirmAnnualImport"><i data-lucide="download" class="w-4 h-4"></i>Importar ${total} elementos</button></div></section></div>`;
  icons();$('cancelAnnualImport').onclick=()=>$('modalHost').innerHTML='';$('annualPreviewBackdrop').addEventListener('click',event=>{if(event.target.id==='annualPreviewBackdrop')$('modalHost').innerHTML=''});$('confirmAnnualImport').onclick=()=>commitAnnualImport(plan);
}
async function commitAnnualImport(plan){
  const monthCounts={},holderMap=new Map(state.holders.map(item=>[norm(item.name),item]));let addedMovements=0,addedLoans=0,updatedLoans=0;
  for(const item of plan.records){
    let person=holderMap.get(norm(item.person));
    if(!person){person={id:uid(),name:item.person,note:'Importado desde registros anuales'};state.holders.push(person);holderMap.set(norm(item.person),person)}
    let accountItem=state.accounts.find(account=>account.importedAnnual&&account.holderId===person.id);
    if(!accountItem){accountItem={id:uid(),name:`Fondo importado · ${person.name}`,type:'Otra',holderId:person.id,institution:'Importación anual',openingBalance:0,importedAnnual:true};state.accounts.push(accountItem)}
    state.movements.push({id:uid(),type:item.type,accountId:accountItem.id,amount:item.amount,date:item.date,description:item.description,category:item.category||'',holderId:person.id,legacyRecordId:item.recordId,importSheet:item.sheet,annualImportKey:item.recordId?recordKey(item.sheet,item):'',createdAt:Date.now()+addedMovements});
    monthCounts[item.month]=(monthCounts[item.month]||0)+1;addedMovements++;
  }
  for(const imported of plan.loanControls){
    let debt=state.debts.find(item=>item.loanImportKey===imported.importKey);
    let person=imported.owner?holderMap.get(norm(imported.owner)):null;
    if(imported.owner&&!person){person={id:uid(),name:imported.owner,note:'Importado desde control de préstamo'};state.holders.push(person);holderMap.set(norm(imported.owner),person)}
    let accountItem=debt?account(debt.accountId):null;
    if(!accountItem&&person)accountItem=state.accounts.find(item=>item.holderId===person.id);
    if(!accountItem){accountItem=state.accounts.find(item=>item.importedLoanKey===imported.importKey)}
    if(!accountItem){accountItem={id:uid(),name:`Préstamo · ${person?.name||imported.title}`,type:'Otra',holderId:person?.id||'',institution:'Importación Excel',openingBalance:0,importedLoanKey:imported.importKey};state.accounts.push(accountItem)}
    const data={id:debt?.id||uid(),kind:imported.kind,title:imported.title,holderId:person?.id||debt?.holderId||'',contact:imported.owner||debt?.contact||'',accountId:accountItem.id,principal:imported.principal,paid:imported.paid,date:imported.date,dueDate:debt?.dueDate||'',notes:'Importado desde Control de Préstamo',payments:imported.payments,history:imported.history,loanBalance:imported.pending,loanImportKey:imported.importKey,sourceSheet:imported.sourceSheet};
    if(debt){Object.assign(debt,data);updatedLoans++}else{state.debts.push(data);addedLoans++}
  }
  if(!await save())return;
  render();
  const monthText=Object.entries(monthCounts).sort((a,b)=>MONTHS.indexOf(a[0])-MONTHS.indexOf(b[0])).map(([month,count])=>`${month[0].toUpperCase()+month.slice(1)}: ${count}`).join(' · ');
  const summary=[addedMovements?`${addedMovements} movimientos`: '',addedLoans?`${addedLoans} controles nuevos`: '',updatedLoans?`${updatedLoans} controles actualizados`: ''].filter(Boolean).join(' · ')||'Sin cambios';
  $('modalHost').innerHTML=`<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"><section class="card w-full max-w-md p-6 text-center shadow-xl"><div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-700"><i data-lucide="circle-check-big" class="w-6 h-6"></i></div><h2 class="mt-4 text-lg font-bold">Importación completada</h2><p class="mt-2 text-sm text-slate-600">${summary} guardados en Cloud Firestore.</p>${monthText?`<div class="mt-4 rounded-xl bg-slate-50 p-3 text-sm capitalize">${monthText}</div>`:''}<p class="mt-3 text-xs text-slate-500">Los saldos pendientes se calcularon con el último Saldo Deuda y el historial de abonos.</p><button class="primary mt-5" id="closeImportResult">Listo</button></section></div>`;
  icons();$('closeImportResult').onclick=()=>$('modalHost').innerHTML='';
}
async function importFile(file,restore){if(restore){const text=await file.text(),data=JSON.parse(text);if(!data||!Array.isArray(data.accounts)||!Array.isArray(data.movements)||!Array.isArray(data.holders)||!Array.isArray(data.debts))throw Error('Respaldo inválido');if(!confirm('¿Reemplazar todos los datos actuales con este respaldo?'))return;state={...blank(),...data};if(await save()){render();toast('Respaldo restaurado en Firestore')}return}if(!window.XLSX)throw Error('SheetJS no disponible');const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const plan=annualPlan(wb);if(plan.matchedSheets||plan.loanControls.length){previewAnnual(plan,file.name);return}const allRows=wb.SheetNames.flatMap(name=>XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''}));let added=0,skipped=0;for(const r of allRows){let type=String(pick(r,['Tipo','Tipo de movimiento','Movimiento','Type'])||'').trim(),low=norm(type);type=['ingreso','income','deposito','entrada'].includes(low)?'Ingreso':['egreso','gasto','expense','salida'].includes(low)?'Egreso':['transferencia','transfer'].includes(low)?'Transferencia':'';let name=String(pick(r,['Cuenta','Fondo','Account'])||'').trim(),destName=String(pick(r,['Destino','Cuenta destino','A cuenta'])||'').trim();let acc=state.accounts.find(a=>norm(a.name)===norm(name));if(!acc&&name){acc={id:uid(),name,type:'Otra',holderId:'',institution:'',openingBalance:0};state.accounts.push(acc)}let dest=state.accounts.find(a=>norm(a.name)===norm(destName));if(!dest&&type==='Transferencia'&&destName){dest={id:uid(),name:destName,type:'Otra',holderId:'',institution:'',openingBalance:0};state.accounts.push(dest)}let amount=pick(r,['Monto','Importe','Cantidad','Amount','Valor','Total']);if(typeof amount==='string')amount=Number(amount.replace(/[Q$\s]/g,'').replace(/,(?=\d{3}(?:\D|$))/g,'').replace(',','.'));amount=Number(amount);const date=parseDate(pick(r,['Fecha','Date','Día','Dia'])),description=String(pick(r,['Descripción','Descripcion','Detalle','Concepto','Description'])||'').trim();if(!type||!acc||!date||!description||!(amount>0)||(type==='Transferencia'&&(!dest||dest.id===acc.id))){skipped++;continue}state.movements.push({id:uid(),type,accountId:acc.id,...(type==='Transferencia'?{toAccountId:dest.id}:{}),amount:Math.round(amount*100)/100,date,description,category:String(pick(r,['Categoría','Categoria','Category'])||''),createdAt:Date.now()+added});added++}if(added){if(await save()){render();toast(`${added} movimientos guardados en Firestore${skipped?`; ${skipped} filas omitidas`:''}`)}return}toast(`No se importaron movimientos válidos${skipped?`; ${skipped} filas omitidas`:''}`,true)}
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const f=e.target.files?.[0];if(!f)return;const restore=e.target.dataset.restore==='1';delete e.target.dataset.restore;try{if(!db)throw Error('Firebase no está conectado.');await importFile(f,restore)}catch(err){console.error(err);toast('No se pudo completar la importación. Revisa la conexión con Firebase y el archivo.',true)}finally{e.target.value=''}});
$('quickAdd').addEventListener('click',()=>{if(!db){toast('Modo lectura: conecta Firebase para registrar movimientos.',true);return}page='movimientos';render();openMovement()});$('quickImport').addEventListener('click',()=>$('importFile').click());document.addEventListener('click',e=>{if(e.target.closest('[data-action="export-xlsx"]'))exportXlsx()});
// The settings page is the primary export entry point; also add a convenient export control to the header.
const exportButton=document.createElement('button');exportButton.className='soft !px-3 !py-2 hidden md:inline-flex items-center gap-2';exportButton.innerHTML='<i data-lucide="file-spreadsheet" class="w-4 h-4"></i><span>Excel</span>';exportButton.title='Exportar movimientos, cuentas y deudas';$('quickImport').parentElement.insertBefore(exportButton,$('quickImport'));exportButton.addEventListener('click',exportXlsx);
render();icons();startFirebase();
})();
</script>
